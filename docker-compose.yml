services:
  postgres:
    image: postgres:16-alpine
    container_name: gpc-postgres
    environment:
      POSTGRES_USER: gpc
      POSTGRES_PASSWORD: gpc
      POSTGRES_DB: gpc
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gpc_postgres:/var/lib/postgresql/data

volumes:
  gpc_postgres:
