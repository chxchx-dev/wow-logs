services:
  postgres:
    image: postgres:16-alpine
    container_name: gpc-postgres
    environment:
      POSTGRES_USER: gpc
      POSTGRES_PASSWORD: gpc
      POSTGRES_DB: gpc
    ports:
      - "5432:5432"
    volumes:
      - gpc_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gpc-redis
    ports:
      - "6379:6379"

volumes:
  gpc_postgres:
